# /etc/nginx/conf.d/aiyan.conf
# Render upstream — change to 127.0.0.1:8001 during blue-green switch.
upstream aiyan_app {
    server 127.0.0.1:8000 fail_timeout=0;
    # server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Let certbot manage 443 after `certbot --nginx`.
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Static files served directly by Nginx, bypassing gunicorn.
    location /static/ {
        alias /data/web/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media files.
    location /media/ {
        alias /data/web/media/;
        expires 7d;
    }

    # Reverse proxy to gunicorn.
    location / {
        proxy_pass http://aiyan_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
