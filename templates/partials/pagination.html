{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="分页">
    <a class="pager__btn{% if page_obj.has_previous %} is-active{% endif %}"
       {% if page_obj.has_previous %}href="?page={{ page_obj.previous_page_number }}{% if request.GET.cat %}&cat={{ request.GET.cat }}{% endif %}"{% endif %}
       {% if not page_obj.has_previous %}aria-disabled="true"{% endif %}>上一页</a>
    <span class="pager__count">{{ page_obj.number }} / {{ paginator.num_pages }}</span>
    <a class="pager__btn{% if page_obj.has_next %} is-active{% endif %}"
       {% if page_obj.has_next %}href="?page={{ page_obj.next_page_number }}{% if request.GET.cat %}&cat={{ request.GET.cat }}{% endif %}"{% endif %}
       {% if not page_obj.has_next %}aria-disabled="true"{% endif %}>下一页</a>
</nav>
{% endif %}
